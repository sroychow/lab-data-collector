name: Deploy LabVault Frontend to GitHub Pages

on:
  push:
    branches:
      - hybrid-github-pages-api
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate runtime config
        run: |
          cat > docs/assets/js/config.js <<EOF
          const API_BASE_URL = "${{ secrets.LABVAULT_API_BASE_URL }}";
          const ADMIN_BASE_URL = "${{ secrets.LABVAULT_ADMIN_BASE_URL }}";
          EOF

      - name: Add nojekyll marker
        run: |
          touch docs/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
