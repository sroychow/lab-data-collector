<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LabVault Experiments</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a class="brand" href="index.html">LabVault</a>
            <div class="actions">
                <a class="btn btn-secondary" href="submission.html">Submissions</a>
                <a class="btn btn-secondary" href="admin.html">
                   Admin Panel 
                </a>
                <span id="userBox" class="muted"></span>
                <button id="logoutButton" class="btn-secondary">Logout</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h1>Active experiments</h1>
            <p class="muted">Choose an experiment to view the schema, submit observations, or inspect submitted data.</p>
            <p id="errorBox" class="error"></p>
        </section>

        <section id="experimentList" class="grid"></section>
    </main>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/experiments.js"></script>
</body>
</html>
