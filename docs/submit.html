<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Data | LabVault</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a class="brand" href="index.html">LabVault</a>
            <div class="actions">
                <a class="btn btn-secondary" href="index.html">Experiments</a>
                <a class="btn btn-secondary" href="submission.html">Submissions</a>
                <button id="logoutButton" class="btn-secondary">Logout</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h1 id="pageTitle">Submit data</h1>
            <p class="muted">Fill the observation rows and submit to the Django API backend.</p>
            <p id="errorBox" class="error"></p>
        </section>

        <form id="submissionForm">
            <section class="card">
                <h2>Submission details</h2>

                <label for="sampleId">Sample / Run ID</label>
                <input id="sampleId" name="sample_id" placeholder="e.g. Group A run 1">

                <label for="notes">Notes</label>
                <input id="notes" name="notes" placeholder="Optional notes">
            </section>

            <div id="formTables"></div>

            <section class="card">
                <button type="submit">Submit data</button>
            </section>
        </form>
    </main>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/submit.js"></script>
</body>
</html>
