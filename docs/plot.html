<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plot | LabVault</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a class="brand" href="index.html">LabVault</a>
            <div class="actions">
                <a class="btn btn-secondary" id="backLink" href="submission.html">Back</a>
                <button id="logoutButton" class="btn-secondary">Logout</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h1 id="plotTitle">Plot</h1>
            <p id="plotMeta" class="muted"></p>
            <p id="errorBox" class="error"></p>
        </section>

        <section class="card">
            <canvas id="labPlot" height="120"></canvas>
        </section>

        <div id="fitBox"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/plot.js"></script>
</body>
</html>
