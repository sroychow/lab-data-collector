<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Experiment | LabVault</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a class="brand" href="index.html">LabVault</a>
            <div class="actions">
                <a class="btn btn-secondary" href="index.html">Experiments</a>
                <a class="btn btn-secondary" href="submission.html">Submissions</a>
                <button id="logoutButton" class="btn-secondary">Logout</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h1 id="experimentTitle">Loading experiment...</h1>
            <p id="experimentMeta" class="muted"></p>
            <p id="experimentObjective"></p>
            <p id="errorBox" class="error"></p>
            <div class="actions">
                <a id="submitLink" class="btn" href="#">Submit data</a>
                <a id="submissionLink" class="btn btn-secondary" href="#">View submitted data</a>
            </div>
        </section>

        <section class="card">
            <h2>Submitted entries for this experiment</h2>
            <div id="experimentSubmissionsBox">
                <p class="muted">Loading submitted entries...</p>
            </div>
        </section>

        <div id="tablesBox"></div>
        <div id="resultsBox"></div>
        <div id="plotsBox"></div>
    </main>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/experiment.js"></script>
</body>
</html>
