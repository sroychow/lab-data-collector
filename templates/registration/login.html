{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | LabVault</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="logo big">LD</div>
    <h1>LabVault</h1>
    <p>Secure web-based lab data collection and preservation.</p>
    {% if form.errors %}<div class="message error">Invalid username or password.</div>{% endif %}
    <form method="post" class="form-stack">
      {% csrf_token %}
      <label>Username {{ form.username }}</label>
      <label>Password {{ form.password }}</label>
      <button class="primary full">Sign in</button>
    </form>
  </div>
</body>
</html>
